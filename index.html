<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC Mobile</title>
    <style>
        * { margin: 0; padding: 0; touch-action: none; user-select: none; box-sizing: border-box; }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 850px;
            background: #0a0a12;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }
        #splash-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a12;
            z-index: 100;
            transition: opacity 0.8s ease;
            padding: 20px;
        }
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-content {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .splash-content img {
            width: 100%;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(255,215,0,0.10);
            margin-bottom: 24px;
        }
        #splash-btn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            color: #1a1a2e;
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 40px rgba(255,215,0,0.15);
            letter-spacing: 0.5px;
        }
        #splash-btn:active { transform: scale(0.94); }
        canvas {
            background: #1a1a2e;
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            border: 2px solid #2a2a4a;
        }
        /* ===== СТИЛИ ДЛЯ МЕНЮ ===== */
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10,10,18,0.96);
            backdrop-filter: blur(16px);
            z-index: 10;
            color: #fff;
            border-radius: 20px;
            padding: 24px 16px;
            box-sizing: border-box;
        }
        #menu.active {
            display: flex;
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .logo small {
            font-size: 0.7rem;
            display: block;
            -webkit-text-fill-color: #666;
            color: #666;
            letter-spacing: 2px;
        }
        /* ОСТАЛЬНЫЕ СТИЛИ МЕНЮ ДОБАВИМ ПОТОМ */
    </style>
</head>
<body>
    <div id="game-wrapper">
        <!-- ОБЛОЖКА -->
        <div id="splash-screen">
            <div class="splash-content">
                <img src="https://i.ibb.co/tpCDN1BQ/68C31D01-A107-46B8-9B73-01956509E301.webp" alt="MC Mobile">
                <button id="splash-btn">▶️ НАЧАТЬ</button>
            </div>
        </div>

        <!-- МЕНЮ -->
        <div id="menu" class="active">
            <div class="logo">⚽ MC<br><small>MOBILE</small></div>
            <!-- СЮДА ПОТОМ ДОБАВИМ ВЫБОР ИГРОКОВ И РЕЖИМОВ -->
        </div>

        <canvas id="gameCanvas" width="600" height="800"></canvas>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const splash = document.getElementById('splash-screen');
            const btn = document.getElementById('splash-btn');
            const menu = document.getElementById('menu');

            btn.addEventListener('click', function() {
                splash.classList.add('hidden');
                setTimeout(() => {
                    menu.classList.add('active');
                    console.log('MC Mobile — игра запущена!');
                }, 800);
            });
        });
    </script>
</body>
</html>
