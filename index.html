<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC MOBILE</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ОБЛОЖКА -->
    <div id="coverScreen">

        <img id="coverImage" src="cover.jpg" alt="MC MOBILE">

        <div id="coverOverlay">

            <h1>MC MOBILE</h1>

            <p>Season 1</p>

            <button id="startButton">
                ▶ НАЧАТЬ
            </button>

        </div>

    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="mainMenu" class="hidden">

        <h1>MC MOBILE</h1>

        <div class="menuButtons">

            <button id="quickMatch">
                ⚽ Быстрый матч
            </button>

            <button id="career">
                🏆 Карьера
            </button>

            <button id="division">
                ⭐ Дивизион
            </button>

            <button id="packs">
                📦 Паки
            </button>

            <button id="settings">
                ⚙ Настройки
            </button>

        </div>

    </div>

    <!-- ЭКРАН ВЫБОРА ИГРОКА -->
    <div id="playerSelect" class="hidden">

        <h2>Выберите игрока</h2>

        <div id="playersGrid">

        </div>

    </div>

    <!-- ЭКРАН ИГРЫ -->
    <div id="gameScreen" class="hidden">

        <div id="scoreBoard">

            <span id="team1">
                FC Masters
            </span>

            <span id="score">
                0 : 0
            </span>

            <span id="team2">
                Real Shamil
            </span>

        </div>

        <div id="timer">

            01:00

        </div>

        <canvas id="gameCanvas"
                width="1200"
                height="650">

        </canvas>

    </div>

    <!-- ЭКРАН ПОСЛЕ МАТЧА -->
    <div id="resultScreen" class="hidden">

        <h1 id="resultTitle">

            Финальный свисток

        </h1>

        <h2 id="finalScore">

            0 : 0

        </h2>

        <button id="playAgain">

            Играть снова

        </button>

        <button id="backMenu">

            Главное меню

        </button>

    </div>

<script src="players.js"></script>
<script src="physics.js"></script>
<script src="bot.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>

</body>
</html>
